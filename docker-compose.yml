# kguanoluisa, Orquestación local de postgres, java-service, python-service y frontend, sin nuevas variables, 2026-07-17
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analyticore
      POSTGRES_PASSWORD: analyticore
      POSTGRES_DB: db_analyticore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyticore -d db_analyticore"]
      interval: 5s
      timeout: 5s
      retries: 5

  java-service:
    build: ./java-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/db_analyticore
      DB_USER: analyticore
      DB_PASSWORD: analyticore
    depends_on:
      postgres:
        condition: service_healthy

  python-service:
    build: ./python-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://analyticore:analyticore@postgres:5432/db_analyticore
      JAVA_SERVICE_URL: http://java-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      java-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - python-service

volumes:
  postgres_data:
