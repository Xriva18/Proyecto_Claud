name: CI/CD AnalytiCore

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  # ===== ETAPA STAGING: build + pruebas unitarias por servicio =====

  test-frontend:
    name: Frontend - Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run build

  test-python:
    name: Python - Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  test-java:
    name: Java - Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - run: mvn test

  # ===== ETAPA SEGURIDAD: build de imagenes + escaneo Trivy =====

  security-scan:
    name: Escaneo de seguridad - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-frontend, test-python, test-java]
    strategy:
      matrix:
        service: [frontend, python-service, java-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen ${{ matrix.service }}
        run: docker build -t analyticore-${{ matrix.service }}:scan ./${{ matrix.service }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: analyticore-${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  # ===== ETAPA PRODUCCION: deploy a Render =====

  deploy-production:
    name: Deploy a produccion (Render)
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Deploy Frontend
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
      - name: Deploy Python
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PYTHON }}"
      - name: Deploy Java
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_JAVA }}"
