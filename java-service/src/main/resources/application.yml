# kguanoluisa, Configuración Spring Boot con PostgreSQL vía DATABASE_URL, sin nuevas variables, 2026-07-17
spring:
  application:
    name: analyticore-java-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/db_analyticore}}
    username: ${DB_USER:analyticore}
    password: ${DB_PASSWORD:analyticore}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# kguanoluisa, Puerto dinámico para Render vía variable PORT con fallback local 8080, sin nuevas variables, 2026-07-17
server:
  port: ${PORT:8080}
