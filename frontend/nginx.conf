# kguanoluisa, Nginx solo sirve la SPA; el API se llama vía VITE_API_URL (Render) o localhost:8000 (Docker local), sin nuevas variables, 2026-07-17
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
